name: publish-approved-draft

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Drafts ref to publish, e.g. drafts/2026-07-26"
        required: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'drafts/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue approved draft to LinkedIn via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: >-
          python3 scheduler/publish_buffer.py --ref
          "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.ref }}"
