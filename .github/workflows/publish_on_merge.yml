name: publish-approved-draft

on:
  pull_request:
    types: [closed]

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'drafts/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue approved draft to LinkedIn via Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
        run: python3 scheduler/publish_buffer.py --ref "${{ github.event.pull_request.head.ref }}"
